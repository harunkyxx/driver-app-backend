services:
  api:
    build: .
    container_name: driver-app-api
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017/driver_app
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_MAPS_API_KEY: ${yourkey}
    depends_on:
      - mongo
      - rabbitmq

  mongo:
    image: mongo:latest
    container_name: driver-app-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: driver-app-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
 
volumes:
  mongo_data:
